[project]
name = "ocp-module-search"
version = "0.1.0"
description = "Bootstrap Search module for Open City Planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["fastapi>=0.116.1"]

[project.entry-points."open_city_planner.modules"]
search = "ocp_module_search.module:DEFINITION"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pyyaml==6.0.3",
  "ruff>=0.12.8",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocp_module_search*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
required-version = "==0.12.5"
build-constraint-dependencies = ["setuptools==84.0.0"]
