name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: scripts/build-bundle
      - run: tar -C frontend -czf dist/search-frontend-0.1.0.tgz dist package.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/*.whl
            dist/search-frontend-0.1.0.tgz
            dist/search-0.1.0.ocp
            dist/search-0.1.0.ocp.sha256
